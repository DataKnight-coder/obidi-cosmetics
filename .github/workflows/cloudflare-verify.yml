name: Cloudflare Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_ASSET_BASE_URL: http://localhost:8787
      DATABASE_URL: file:./dev.db
      AUTH_SECRET: ci-placeholder-auth-secret-not-for-production
      AUTH_TRUST_HOST: "true"
      PAYSTACK_SECRET_KEY: sk_test_ci_placeholder
      NEXT_PUBLIC_GA_ID: G-CI00000000
      GA4_API_SECRET: ci-placeholder
      GA4_MEASUREMENT_ID: G-CI00000000
      EMAIL_FROM: CI <ci@example.invalid>
      RESEND_API_KEY: re_ci_placeholder
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Prisma schema
        run: npx prisma format

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare build-time SQLite schema
        run: npx prisma db push --skip-generate

      - name: Generate Cloudflare types
        run: npx wrangler types

      - name: Apply local D1 migrations
        run: npx wrangler d1 migrations apply obidi-cosmetics --local

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build Next.js
        run: npm run build

      - name: Build OpenNext Cloudflare bundle
        run: npx opennextjs-cloudflare build
