name: Deploy Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obidi-staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      APP_URL: ${{ vars.STAGING_APP_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.STAGING_APP_URL }}
      NEXT_PUBLIC_ASSET_BASE_URL: ${{ vars.STAGING_ASSET_BASE_URL }}

      AUTH_TRUST_HOST: "true"
      DATABASE_URL: file:./dev.db
      AUTH_SECRET: ci-placeholder-auth-secret-not-for-production
      PAYSTACK_SECRET_KEY: sk_test_ci_placeholder
      NEXT_PUBLIC_GA_ID: G-CI00000000
      GA4_API_SECRET: ci-placeholder
      GA4_MEASUREMENT_ID: G-CI00000000
      EMAIL_FROM: CI <ci@example.invalid>
      RESEND_API_KEY: re_ci_placeholder
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Prisma installation
        run: |
          node --version
          npm ls prisma @prisma/client @prisma/adapter-d1 || true
          npx prisma version
          echo "----- Prisma generator -----"
          sed -n '/generator client/,/}/p' prisma/schema.prisma

      - name: Prepare build-time SQLite schema
        run: npx prisma db push --skip-generate

      - name: Clean stale Prisma output
        run: |
          rm -rf node_modules/.prisma
          rm -rf src/generated/prisma
          rm -rf .next
          rm -rf .open-next

      - name: Generate Rust-free Prisma Client
        run: npx prisma generate

      - name: Verify generated Prisma Client
        run: |
          echo "Generated Prisma files:"
          find src/generated/prisma -maxdepth 2 -type f | sort | head -100

          if [ ! -d "src/generated/prisma" ]; then
            echo "::error::Prisma Client was not generated."
            exit 1
          fi

          if [ ! -f "src/generated/prisma/index.d.ts" ] &&
             [ ! -f "src/generated/prisma/client.ts" ] &&
             [ ! -f "src/generated/prisma/client.d.ts" ]; then
            echo "::error::Expected generated Prisma Client entrypoint was not found."
            exit 1
          fi

      - name: Generate Cloudflare types
        run: npx wrangler types --env staging

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build Next.js application
        run: npm run build

      - name: Apply D1 migrations to Staging
        run: npx wrangler d1 migrations apply DB --remote --env staging

      - name: Validate staging configuration
        shell: bash
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::STAGING_APP_URL is missing from the staging GitHub Environment."
            exit 1
          fi

          if [ -z "$NEXT_PUBLIC_ASSET_BASE_URL" ]; then
            echo "::error::STAGING_ASSET_BASE_URL is missing from the staging GitHub Environment."
            exit 1
          fi

      - name: Build OpenNext Cloudflare bundle
        run: npx opennextjs-cloudflare build

      - name: Fail if old query engine is present
        shell: bash
        run: |
          WASM_FILES=$(find .open-next -type f \( -name "query_engine_bg.wasm" -o -name "query_engine_bg.sqlite.wasm" \) 2>/dev/null || true)
          if [ -n "$WASM_FILES" ]; then
            echo "::error::Old Prisma query-engine WASM is still present."
            echo "$WASM_FILES"
            exit 1
          fi

      - name: Bundle Size Guard
        shell: bash
        run: |
          npx wrangler deploy --env staging --dry-run --outdir=wrangler-dist > dry-run.log 2>&1 || true
          cat dry-run.log
          if ls wrangler-dist/*.js 1> /dev/null 2>&1; then
            SIZE=$(gzip -c wrangler-dist/*.js | wc -c)
            echo "Compressed Worker Size: $SIZE bytes"
            if [ "$SIZE" -gt 3145728 ]; then
              echo "::error::Worker exceeds 3 MiB Free-plan limit ($SIZE bytes)!"
              exit 1
            fi
          else
            echo "::warning::Could not find compiled worker in wrangler-dist. Size guard skipped."
          fi

      - name: Deploy to Cloudflare Staging
        run: npx wrangler deploy --env staging
